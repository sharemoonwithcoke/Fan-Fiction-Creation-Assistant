<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.feat-card { background:#FFFCF5; border:1px solid var(--border); border-radius:14px; padding:20px; box-shadow:var(--shadow-md); flex:1; min-width:200px;}
.feat-card .h { font-family:var(--font-display); font-weight:600; font-size:22px; color:var(--ink-walnut); margin-bottom:4px;}
.feat-card .d { font-family:var(--font-body); font-size:13px; line-height:1.5; color:var(--fg-2);}
.feat-card .icn { width:40px; height:40px; color:var(--claret); margin-bottom:10px;}
.proj-card { background:#FFFCF5; border:1px solid var(--border); border-radius:12px; padding:14px 16px; box-shadow:var(--shadow-sm); flex:1; min-width:200px;}
.proj-card .chip { font-family:var(--font-body); font-size:11px; padding:2px 8px; border-radius:999px; background:var(--paper-linen); color:var(--ink-cocoa); display:inline-block; margin-bottom:6px;}
.proj-card .ttl { font-family:var(--font-body); font-weight:600; color:var(--ink-walnut); margin-bottom:2px;}
.proj-card .meta { font-family:var(--font-mono); font-size:11px; color:var(--fg-3);}
</style>
</head>
<body><div class="card">
  <div class="row" style="align-items:stretch">
    <div class="feat-card">
      <svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
      <div class="h">文字成图</div>
      <div class="d">Turn prose into postcards — Weibo, Xiaohongshu &amp; bespoke.</div>
    </div>
    <div class="proj-card">
      <span class="chip">视觉小说</span>
      <div class="ttl">A Quiet Afternoon in the Hedge</div>
      <div class="meta">edited 25 may 2026</div>
    </div>
  </div>
  <div class="eyebrow">Cards · cream paper, hairline edge, walnut shadow · feature card vs project card</div>
</div></body></html>
