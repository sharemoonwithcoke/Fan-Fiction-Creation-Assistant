<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="row" style="align-items:flex-start;gap:6px">
    <div class="col" style="flex:1">
      <div class="eyebrow">DANGER</div>
      <div class="row">
        <div style="background:#F2D9D4;color:#8A2C2C;padding:6px 12px;border-radius:8px;font-family:var(--font-body);font-size:13px;border:1px solid #8A2C2C40">Delete forever</div>
      </div>
    </div>
    <div class="col" style="flex:1">
      <div class="eyebrow">WARNING</div>
      <div class="row">
        <div style="background:#F7E9C4;color:#7a5e1e;padding:6px 12px;border-radius:8px;font-family:var(--font-body);font-size:13px;border:1px solid #C89B3C40">Unsaved changes</div>
      </div>
    </div>
    <div class="col" style="flex:1">
      <div class="eyebrow">SUCCESS</div>
      <div class="row">
        <div style="background:#E5E9D6;color:#4D5B3C;padding:6px 12px;border-radius:8px;font-family:var(--font-body);font-size:13px;border:1px solid #4D5B3C40">Saved to library</div>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col"><div class="swatch" style="background:#F2D9D4"></div><div class="swatch-hex">danger-bg</div></div>
    <div class="col"><div class="swatch" style="background:#F7E9C4"></div><div class="swatch-hex">warning-bg</div></div>
    <div class="col"><div class="swatch" style="background:#E5E9D6"></div><div class="swatch-hex">success-bg</div></div>
    <div class="col"><div class="swatch" style="background:#F2D9D4;border-color:#8A2C2C"></div><div class="swatch-hex">danger</div></div>
    <div class="col"><div class="swatch" style="background:#F7E9C4;border-color:#C89B3C"></div><div class="swatch-hex">warning</div></div>
    <div class="col"><div class="swatch" style="background:#E5E9D6;border-color:#4D5B3C"></div><div class="swatch-hex">success</div></div>
  </div>
</div></body></html>
