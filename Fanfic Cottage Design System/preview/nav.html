<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.nav { background:#FFFCF5; border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow-sm); padding:10px 16px; display:flex; align-items:center; gap:8px;}
.brand { display:flex; align-items:center; gap:8px; margin-right:14px;}
.brand .ring { width:28px; height:28px; border-radius:50%; border:1.5px solid var(--claret); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-style:italic; font-weight:600; color:var(--claret); font-size:18px; line-height:1;}
.brand .name { font-family:var(--font-display); font-weight:600; font-size:18px; color:var(--ink-walnut); letter-spacing:.3px;}
.nav-link { font-family:var(--font-body); font-size:13px; color:var(--fg-2); padding:6px 11px; border-radius:8px; text-decoration:none; transition:all .2s var(--ease-out);}
.nav-link:hover { background:var(--paper-oat); color:var(--fg);}
.nav-link.active { background:var(--accent-soft); color:var(--claret-deep); font-weight:600;}
.nav .right { margin-left:auto; display:flex; align-items:center; gap:10px; font-family:var(--font-body); font-size:12px; color:var(--fg-3);}
.avatar { width:24px; height:24px; border-radius:50%; background:var(--sage); color:#FBF6EC; font-family:var(--font-display); font-weight:600; font-size:14px; display:flex; align-items:center; justify-content:center;}
</style>
</head>
<body><div class="card" style="padding:18px 22px">
  <div class="nav">
    <div class="brand"><div class="ring">&amp;</div><div class="name">Fanfic&nbsp;Cottage</div></div>
    <a class="nav-link active" href="#">首页</a>
    <a class="nav-link" href="#">我的项目</a>
    <a class="nav-link" href="#">文字成图</a>
    <a class="nav-link" href="#">论坛截图</a>
    <a class="nav-link" href="#">视觉小说</a>
    <div class="right"><div class="avatar">Q</div><span>Quill</span></div>
  </div>
  <div class="eyebrow">Header navigation · sticky, 56px, sits on the page grain</div>
</div></body></html>
