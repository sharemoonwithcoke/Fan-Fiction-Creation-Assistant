<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div style="display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap">
    <div style="text-align:center"><div style="width:64px;height:48px;background:#FFFCF5;border:1px solid var(--border);border-radius:4px;box-shadow:var(--shadow-sm)"></div><div class="swatch-hex" style="margin-top:6px">xs · 4px</div></div>
    <div style="text-align:center"><div style="width:64px;height:48px;background:#FFFCF5;border:1px solid var(--border);border-radius:6px;box-shadow:var(--shadow-sm)"></div><div class="swatch-hex" style="margin-top:6px">sm · 6px</div></div>
    <div style="text-align:center"><div style="width:64px;height:48px;background:#FFFCF5;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-sm)"></div><div class="swatch-hex" style="margin-top:6px">md · 10px</div></div>
    <div style="text-align:center"><div style="width:64px;height:48px;background:#FFFCF5;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-sm)"></div><div class="swatch-hex" style="margin-top:6px">lg · 14px</div></div>
    <div style="text-align:center"><div style="width:64px;height:48px;background:#FFFCF5;border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow-sm)"></div><div class="swatch-hex" style="margin-top:6px">xl · 20px</div></div>
    <div style="text-align:center"><div style="width:64px;height:48px;background:#FFFCF5;border:1px solid var(--border);border-radius:999px;box-shadow:var(--shadow-sm)"></div><div class="swatch-hex" style="margin-top:6px">pill</div></div>
  </div>
  <div class="eyebrow">Corner radii · soft paperback edges, never sharp, never too round</div>
</div></body></html>
