<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="background:var(--paper-cream);padding:24px">
  <div style="display:flex;gap:22px;flex-wrap:wrap;align-items:center">
    <div style="text-align:center"><div style="width:80px;height:56px;background:#FFFCF5;border-radius:10px;box-shadow:0 1px 2px rgba(61,42,31,.06),0 1px 1px rgba(61,42,31,.04)"></div><div class="swatch-hex" style="margin-top:8px">sm</div></div>
    <div style="text-align:center"><div style="width:80px;height:56px;background:#FFFCF5;border-radius:10px;box-shadow:0 4px 8px rgba(61,42,31,.08),0 2px 4px rgba(61,42,31,.05)"></div><div class="swatch-hex" style="margin-top:8px">md</div></div>
    <div style="text-align:center"><div style="width:80px;height:56px;background:#FFFCF5;border-radius:10px;box-shadow:0 12px 24px rgba(61,42,31,.10),0 4px 8px rgba(61,42,31,.06)"></div><div class="swatch-hex" style="margin-top:8px">lg</div></div>
    <div style="text-align:center"><div style="width:80px;height:56px;background:#FFFCF5;border-radius:10px;box-shadow:0 22px 40px rgba(61,42,31,.14),0 8px 16px rgba(61,42,31,.08)"></div><div class="swatch-hex" style="margin-top:8px">xl</div></div>
    <div style="text-align:center"><div style="width:80px;height:56px;background:var(--paper-oat);border-radius:10px;box-shadow:inset 0 2px 4px rgba(61,42,31,.06)"></div><div class="swatch-hex" style="margin-top:8px">inner</div></div>
    <div style="text-align:center"><div style="width:80px;height:42px;background:var(--claret);border-radius:10px;box-shadow:0 2px 0 var(--claret-deep),0 4px 10px rgba(110,31,31,.25);color:#fff;font-family:var(--font-display);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center">Seal</div><div class="swatch-hex" style="margin-top:8px">wax</div></div>
  </div>
  <div class="eyebrow">Shadows · always walnut-tinted, never grey</div>
</div></body></html>
