<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="padding:22px 26px;gap:18px">

  <!-- visible bars at every scale -->
  <div style="display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap">
    <div style="text-align:center"><div style="width:14px;height:4px;background:var(--honey);border-radius:1px"></div><div class="swatch-hex" style="margin-top:8px;line-height:1.3">space-1<br>4&nbsp;px</div></div>
    <div style="text-align:center"><div style="width:18px;height:8px;background:var(--honey);border-radius:1px"></div><div class="swatch-hex" style="margin-top:8px;line-height:1.3">space-2<br>8&nbsp;px</div></div>
    <div style="text-align:center"><div style="width:22px;height:12px;background:var(--honey);border-radius:2px"></div><div class="swatch-hex" style="margin-top:8px;line-height:1.3">space-3<br>12&nbsp;px</div></div>
    <div style="text-align:center"><div style="width:26px;height:16px;background:var(--honey);border-radius:2px"></div><div class="swatch-hex" style="margin-top:8px;line-height:1.3">space-4<br>16&nbsp;px</div></div>
    <div style="text-align:center"><div style="width:30px;height:20px;background:var(--honey);border-radius:3px"></div><div class="swatch-hex" style="margin-top:8px;line-height:1.3">space-5<br>20&nbsp;px</div></div>
    <div style="text-align:center"><div style="width:34px;height:24px;background:var(--honey);border-radius:3px"></div><div class="swatch-hex" style="margin-top:8px;line-height:1.3">space-6<br>24&nbsp;px</div></div>
    <div style="text-align:center"><div style="width:42px;height:32px;background:var(--honey);border-radius:4px"></div><div class="swatch-hex" style="margin-top:8px;line-height:1.3">space-8<br>32&nbsp;px</div></div>
    <div style="text-align:center"><div style="width:50px;height:40px;background:var(--honey);border-radius:4px"></div><div class="swatch-hex" style="margin-top:8px;line-height:1.3">space-10<br>40&nbsp;px</div></div>
    <div style="text-align:center"><div style="width:58px;height:48px;background:var(--honey);border-radius:5px"></div><div class="swatch-hex" style="margin-top:8px;line-height:1.3">space-12<br>48&nbsp;px</div></div>
    <div style="text-align:center"><div style="width:74px;height:64px;background:var(--honey);border-radius:6px"></div><div class="swatch-hex" style="margin-top:8px;line-height:1.3">space-16<br>64&nbsp;px</div></div>
  </div>

  <!-- spacing-in-use: rhythm sample -->
  <div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow-sm)">
    <div style="display:flex;flex-direction:column;gap:4px">
      <span style="font-family:var(--font-body);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--fg-3);font-weight:600">SPACING IN USE</span>
      <span style="font-family:var(--font-display);font-size:22px;font-weight:600;color:var(--ink-walnut);line-height:1.1">Card padding 24, gap 16</span>
    </div>
    <div style="display:flex;gap:12px"><div style="background:#F7E9C4;color:#7a5e1e;font-size:11px;padding:2px 10px;border-radius:999px;font-weight:600">gap 12 between chips</div><div style="background:#E5E9D6;color:var(--sage-deep);font-size:11px;padding:2px 10px;border-radius:999px;font-weight:600">cottage</div></div>
  </div>

  <div class="eyebrow">4&nbsp;px grid · use space-6 for card padding · space-12 for section gutters</div>
</div></body></html>
