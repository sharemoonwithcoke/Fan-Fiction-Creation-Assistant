<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="padding:20px 26px;gap:12px;background:linear-gradient(180deg,#FFFCF5 0%,#FBF6EC 100%);position:relative">
  <!-- handwritten copperplate -->
  <div style="font-family:'Pinyon Script',cursive;font-size:62px;line-height:1;color:var(--claret);letter-spacing:0.5px">
    Dearest Reader,
  </div>
  <!-- schoolbook handwriting -->
  <div style="font-family:'Caveat',cursive;font-weight:600;font-size:24px;line-height:1.15;color:var(--ink-cocoa);max-width:560px">
    Set the kettle on — the chapter you've been turning over is ready to be written.
  </div>
  <!-- workhorse display serif beneath -->
  <div style="font-family:var(--font-display);font-weight:600;font-size:22px;color:var(--ink-walnut);letter-spacing:-0.01em;margin-top:2px">
    A snug parlour for fan-fiction makers.
  </div>
  <div class="eyebrow" style="margin-top:4px">Display family · Pinyon Script (copperplate) → Caveat (schoolbook) → Cormorant Garamond (workhorse)</div>
  <!-- tiny postage-stamp ornament -->
  <div style="position:absolute;top:14px;right:18px;width:40px;height:48px;border:1.2px dashed var(--ink-tea-stain);border-radius:3px;display:flex;align-items:center;justify-content:center;background:var(--paper-oat);transform:rotate(6deg)">
    <span style="font-family:'Pinyon Script',cursive;font-size:24px;color:var(--claret);line-height:1">&amp;</span>
  </div>
</div></body></html>
