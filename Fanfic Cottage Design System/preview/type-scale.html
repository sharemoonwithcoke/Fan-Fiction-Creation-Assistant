<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="gap:8px">
  <div style="display:flex;align-items:baseline;gap:16px"><span style="font-family:var(--font-display);font-weight:600;font-size:48px;line-height:1;color:var(--ink-walnut)">H1</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3)">48 / 1.15 · Cormorant Garamond 600</span></div>
  <div style="display:flex;align-items:baseline;gap:16px"><span style="font-family:var(--font-display);font-weight:600;font-size:38px;line-height:1;color:var(--ink-walnut)">H2</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3)">38 / 1.15 · Cormorant Garamond 600</span></div>
  <div style="display:flex;align-items:baseline;gap:16px"><span style="font-family:var(--font-display);font-weight:500;font-size:30px;line-height:1;color:var(--ink-walnut)">H3</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3)">30 / 1.35 · Cormorant Garamond 500</span></div>

  <div style="display:flex;align-items:baseline;gap:16px"><span style="font-family:var(--font-body);font-size:17px;color:var(--ink-walnut);font-style:italic">Lead paragraph</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3)">17 / 1.85 · Lora italic</span></div>
  <div style="display:flex;align-items:baseline;gap:16px"><span style="font-family:var(--font-body);font-size:15px;color:var(--ink-cocoa)">Body paragraph</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3)">15 / 1.6 · Lora 400</span></div>
  <div style="display:flex;align-items:baseline;gap:16px"><span style="font-family:var(--font-body);font-size:12px;text-transform:uppercase;letter-spacing:0.12em;color:var(--fg-3);font-weight:600">EYEBROW</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3)">12 / wider tracking · Lora 600</span></div>
